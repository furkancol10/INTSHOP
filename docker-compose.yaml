services:
  db:
    image: postgres:18
    environment:
       POSTGRES_USER: ${POSTGRES_USER:-stok}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1111}
       POSTGRES_DB: ${POSTGRES_DB:-stokdb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stok} -d ${POSTGRES_DB:-stokdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./backend
    ports:
      - "${API_PORT:-5081}:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-stokdb};Username=${POSTGRES_USER:-stok};Password=${POSTGRES_PASSWORD:-1111}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:${API_PORT:-5081}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
volumes:
  pgdata: