services:
  db:
    image: postgres:18
    environment:
       POSTGRES_USER: ${POSTGRES_USER}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
       POSTGRES_DB: ${POSTGRES_DB}
    # DB'yi host'a acmiyoruz - api zaten ayni compose agi uzerinden "db:5432" ile erisiyor.
    # Yerel psql erisimi gerekiyorsa: docker compose exec db psql -U $POSTGRES_USER -d $POSTGRES_DB
    # postgres:18+ imajlari veriyi surum-spesifik alt dizinlerde tutar (pg_ctlcluster
    # tarzi) ve tek bir mount'un /var/lib/postgresql'e (alt dizinsiz) yapilmasini bekler -
    # /var/lib/postgresql/data'ya mount etmek (eski surumlerin kalibi) 18+ ile calismiyor.
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./backend
    ports:
      - "${API_PORT}:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN:-http://localhost:5173}"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:5081}"
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - api
volumes:
  pgdata: