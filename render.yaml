databases:
  - name: stok-panel-db
    plan: free
    postgresMajorVersion: 18

services:
  - type: web
    name: stok-panel-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__Default
        fromDatabase:
          name: stok-panel-db
          property: connectionString
      # Netlify'a deploy ettikten sonra frontend URL'ini buraya gir
      # (virgülle birden fazla origin eklenebilir), sonra bu servisi
      # Render panelinden "Manual Deploy" ile yeniden başlat.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
