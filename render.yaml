databases:
  - name: stok-panel-db
    plan: free
    postgresMajorVersion: 18

services:
  - type: web
    name: stok-panel-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__Default
        fromDatabase:
          name: stok-panel-db
          property: connectionString
      # Host filtresi: canli hostname olmadan ASP.NET tum istekleri 400 ile reddeder
      - key: AllowedHosts
        value: stok-panel-api.onrender.com;localhost;127.0.0.1
      # Frontend'in canli adresleri (virgulle birden fazla origin eklenebilir)
      - key: CORS_ALLOWED_ORIGINS
        value: https://stok-panel-three.vercel.app,https://stok-panel-furkancol10s-projects.vercel.app,http://localhost:5173
